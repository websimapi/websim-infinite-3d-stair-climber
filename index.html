<!DOCTYPE html>
<html>
<head>
  <title>Infinite 3D Stair Climber</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #87CEEB; }
    canvas { display: block; }
    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: Arial, sans-serif;
      background-color: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 5px;
    }
    #leaderboard {
      position: absolute;
      top: 10px;
      right: 10px;
      color: white;
      font-family: Arial, sans-serif;
      background-color: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 5px;
      max-height: 300px;
      overflow-y: auto;
    }
    #leaderboard h3 { margin-top: 0; }
    #leaderboard ul { list-style: none; padding: 0; margin: 0; }
    #leaderboard li { margin-bottom: 5px; }
    #leaderboard li img { width: 20px; height: 20px; vertical-align: middle; margin-right: 5px; border-radius: 50%; }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/",
        "websim": "/websim.js"
      }
    }
  </script>
  <div class="info">
    Press SPACE to climb!
    <div id="my-score">My Score: 0</div>
  </div>
  <div id="leaderboard">
    <h3>Leaderboard</h3>
    <ul id="leaderboard-list"></ul>
  </div>
  <script type="module" src="/main.js"></script>
